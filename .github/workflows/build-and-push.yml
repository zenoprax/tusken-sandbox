name: Build and Push Container

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "renovate/**"
    paths:
      - Containerfile
      - ".github/workflows/**"
  pull_request:
    branches:
        - main
    paths:
      - Containerfile
      - ".github/workflows/**"

env:
  IMAGE: ghcr.io/${{ github.repository }}
  TAG: ${{ github.ref_name }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            podman login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Build image
        run: podman build --tag "${IMAGE}:main" .

      - name: Push image
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch')
        run: podman push "${IMAGE}:main"
